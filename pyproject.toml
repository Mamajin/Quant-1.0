[project]
name = "quantify"
version = "0.1.0"
description = "Local, free options-flow & quant-trading research app for US equities/ETFs"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "duckdb>=1.0.0",
    "pyarrow>=16.0.0",
    "polars>=1.0.0",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "yfinance>=0.2.40",
    "apscheduler>=3.10.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "streamlit>=1.35.0",
    "plotly>=5.20.0",
    "pydantic>=2.6.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "python-dotenv>=1.0.0",
    "requests>=2.34.2",
    "plyer>=2.1.0",
    "tomlkit>=0.15.1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantify"]

[tool.pytest.ini_options]
testpaths = ["tests"]
